services:
  # The Mail Transfer Agent (Postfix) receives incoming mail
  # on TCP port 25.
  mta:
    image: jeboehm/mailserver-mta:latest
    build:
      context: ../../target/mta
      cache_from:
        - type=registry,ref=ghcr.io/jeboehm/mailserver-mta:buildcache
    restart: on-failure:5
    env_file: ../../.env
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      # Accepts the former MYSQL_* names as a fallback.
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-mailserver}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-}}
      DB_PORT: ${DB_PORT:-${MYSQL_PORT:-3306}}
      DB_TLS_VERIFY_CERT: ${DB_TLS_VERIFY_CERT:-${MYSQL_TLS_VERIFY_CERT:-no}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-mailserver}}
    volumes:
      - data-tls:/etc/postfix/tls:ro
      - data-spool:/var/spool/postfix
      # For using external certificates uncomment the following lines
      # and change the path on the left side of the colon.
      # - /home/user/certs/mail.example.com.crt:/etc/postfix/tls/tls.crt:ro
      # - /home/user/certs/mail.example.com.key:/etc/postfix/tls/tls.key:ro

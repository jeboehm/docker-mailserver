---
services:
  mailpit:
    image: axllent/mailpit:v1.27
    env_file: .env
    volumes:
      - data-tls:/etc/mailpit/tls:ro
    environment:
      - MP_SMTP_TLS_CERT=/etc/mailpit/tls/tls.crt
      - MP_SMTP_TLS_KEY=/etc/mailpit/tls/tls.key
  fetchmail:
    links:
      - mda:mda.local

  test:
    image: jeboehm/mailserver-test:latest
    build: ./test/bats
    volumes:
      - data-mail:/srv/vmail:ro
      - data-tls:/media/tls:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For development
      - ./test/bats/integration:/app/tests:ro
    env_file: .env
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      # Accepts the former MYSQL_* names as a fallback.
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-mailserver}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-}}
      DB_PORT: ${DB_PORT:-${MYSQL_PORT:-3306}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-mailserver}}
    depends_on:
      - mailpit
      - fetchmail

  # For development
  # web:
  #   volumes:
  #     - ./target/web/rootfs/etc/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
  #   ports:
  #     - "0.0.0.0:81:80"

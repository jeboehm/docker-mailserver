apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: postgres
  selector:
    app.kubernetes.io/name: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: config-env
          # The postgres image expects POSTGRES_*, the rest of the stack uses
          # DB_*. There is no equivalent of DB_ROOT_PASSWORD.
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: config-env
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: config-env
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: config-env
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            # Mirrors DB_DATA_DIR of the compose deployment. The postgres image
            # declares its volume here and keeps PGDATA below this path.
            - name: postgres-data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: postgres-data
          emptyDir: {}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# generatorOptions only applies to the generators declared in this file, so it
# has to be repeated in every overlay that generates something. config-env must
# keep its exact name: test-job.yaml and deploy/kustomize/web/deployment.yaml
# reference it from outside this build.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: config-env
    envs:
      - ../../../.env
  # Mounted by the load-fixtures init container in ../test-job.yaml, which is
  # applied with plain `kubectl apply -f` outside this build, so the name must
  # stay test-fixtures.
  - name: test-fixtures
    files:
      - fixtures.sh=../../fixtures.sh
resources:
  - mailpit.yaml
  - ../../../deploy/kustomize/ingress/traefik/

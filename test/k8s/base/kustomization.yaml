apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# generatorOptions only applies to the generators declared in this file, so it
# has to be repeated in every overlay that generates something. config-env and
# secret-config-env must keep their exact names: test-job.yaml and the
# workloads in deploy/kustomize/ reference them from outside this build. Both
# are generated from the files `make kubernetes-env` splits .env into, like in
# the root kustomization, so that applying either build leaves the same keys.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: config-env
    envs:
      - ../../../config/kubernetes/config.env
  # Mounted by the load-fixtures init container in ../test-job.yaml, which is
  # applied with plain `kubectl apply -f` outside this build, so the name must
  # stay test-fixtures.
  - name: test-fixtures
    files:
      - fixtures.sh=../../fixtures.sh
secretGenerator:
  - name: secret-config-env
    envs:
      - ../../../config/kubernetes/secret.env
resources:
  - mailpit.yaml
  - ../../../deploy/kustomize/ingress/traefik/

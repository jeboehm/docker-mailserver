apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mysql-initdb
    files:
      - ../../../target/db/mysql/initdb.d/001_mailserver.sql
      - ../../../target/db/mysql/initdb.d/002_webmail.sql
resources:
  - ../base/
  - mysql.yaml

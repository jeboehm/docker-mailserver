apiVersion: batch/v1
kind: Job
metadata:
  name: test-runner-job
  labels:
    app.kubernetes.io/name: test-runner-job
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: docker-mailserver
spec:
  # A failed test run is not retried; the Makefile reports it right away.
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-runner-job
        app.kubernetes.io/component: test
        app.kubernetes.io/part-of: docker-mailserver
    spec:
      automountServiceAccountToken: true
      serviceAccountName: test-runner-sa
      restartPolicy: Never
      initContainers:
        - name: load-fixtures
          image: jeboehm/mailserver-web:latest
          imagePullPolicy: IfNotPresent
          # test/fixtures.sh, mounted from the test-fixtures ConfigMap that
          # test/k8s/base/kustomization.yaml generates.
          command:
            - /bin/sh
            - /opt/fixtures/fixtures.sh
          env:
            # Kubernetes specific fetchmail source: the mda Service on the
            # standard IMAP port.
            - name: FIXTURES_MDA_IMAP_ADDRESS
              value: mda.default:143
          envFrom:
            - configMapRef:
                name: config-service-map
            - configMapRef:
                name: config-env
            - secretRef:
                name: secret-config-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
          volumeMounts:
            - name: fixtures
              mountPath: /opt/fixtures
              readOnly: true
      containers:
        - name: integration-tests
          image: jeboehm/mailserver-test:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: config-service-map
            - configMapRef:
                name: config-env
            - secretRef:
                name: secret-config-env
          env:
            - name: IS_KUBERNETES
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: tls-certs
              mountPath: /media/tls
            - name: vmail
              mountPath: /srv/vmail
              readOnly: true
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tls-certs
          secret:
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            secretName: tls-certs
        - name: vmail
          persistentVolumeClaim:
            claimName: mda-data-mda-0
        - name: fixtures
          configMap:
            name: test-fixtures
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner-sa
  labels:
    app.kubernetes.io/name: test-runner-sa
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: docker-mailserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-runner-cluster-admin
  labels:
    app.kubernetes.io/name: test-runner-cluster-admin
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: docker-mailserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: test-runner-sa
    namespace: default

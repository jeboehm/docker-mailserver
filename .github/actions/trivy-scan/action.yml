name: Trivy image scan
description: Scan one image, report the findings to the Security tab and optionally fail on the ones that have a fix.
inputs:
  image-ref:
    description: Image reference to scan. Mutually exclusive with input.
    default: ""
  input:
    description: Path to a docker-archive tar to scan instead of a registry reference.
    default: ""
  category:
    description: Image name. Used as the SARIF category and as the heading of the summary.
    required: true
  severities:
    description: Comma separated severities that are reported.
    default: CRITICAL,HIGH
  upload-sarif:
    description: >-
      Upload the SARIF report. Has to be false for pull requests from a fork,
      where GITHUB_TOKEN is not allowed to write security events.
    default: "true"
  gate:
    description: Fail the step when a finding has a fix available.
    default: "false"
outputs:
  fixable:
    description: Number of findings that have a fix available.
    value: ${{ steps.summary.outputs.fixable }}
runs:
  using: composite
  steps:
    # Everything below is derived from this one JSON report: it keeps the image
    # from being pulled twice, and it avoids trivy-action's SARIF handling,
    # which drops the severity filter unless limit-severities-for-sarif is set.
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        input: ${{ inputs.input }}
        format: json
        output: trivy-results.json
        trivyignores: .trivyignore.yaml
    - name: Convert the report to SARIF
      shell: bash
      env:
        SEVERITIES: ${{ inputs.severities }}
      run: |
        trivy convert --quiet --severity "${SEVERITIES}" --format sarif \
          --output trivy-results.sarif trivy-results.json
    - name: Upload Trivy scan results to GitHub Security tab
      if: ${{ inputs.upload-sarif == 'true' && hashFiles('trivy-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        sarif_file: trivy-results.sarif
        category: ${{ inputs.category }}
    # The Security tab keeps the full picture including the findings without a
    # fix; the summary is the short, actionable list for the job log.
    - name: Summarize the findings
      id: summary
      shell: bash
      env:
        REPORT: trivy-results.json
        CATEGORY: ${{ inputs.category }}
        SUMMARY: trivy-summary-${{ inputs.category }}.md
        SEVERITIES: ${{ inputs.severities }}
      run: .github/bin/trivy_summary.sh
    - name: Fail on findings that have a fix
      if: ${{ inputs.gate == 'true' && steps.summary.outputs.fixable != '0' }}
      shell: bash
      env:
        CATEGORY: ${{ inputs.category }}
        FIXABLE: ${{ steps.summary.outputs.fixable }}
      run: |
        echo "::error title=${CATEGORY}::${FIXABLE} finding(s) with a fix available"
        exit 1

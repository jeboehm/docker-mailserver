name: Build and test application
on:
  push:
    branches:
      - main
      - next
    tags: [v*]
  pull_request:
    paths:
      - ".env.dist"
      - ".github/actions/**"
      - ".github/bin/**"
      - ".github/images.txt"
      - ".github/test-matrix/**"
      - ".github/workflows/build.yml"
      - "bin/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "kustomization.yaml"
      - "Makefile"
      - "target/**"
      - "test/**"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  # Populates the additional-image cache from a ref that pull requests can read.
  # Caches written by a pull request are scoped to that pull request only, so
  # without this job every pull request pays a full registry pull.
  warm_image_cache:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/additional-images
        with:
          mode: none
          save: "true"
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - context: target/mda
            image: mailserver-mda
          - context: target/mta
            image: mailserver-mta
          - context: target/filter
            image: mailserver-filter
          - context: target/web
            image: mailserver-web
          - context: target/ssl
            image: mailserver-ssl
          - context: target/unbound
            image: mailserver-unbound
          - context: test/bats
            image: mailserver-test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        if: ${{ github.event_name != 'pull_request' && matrix.image != 'mailserver-test' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Container Registry (ghcr.io)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Container Registry (docker.io)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/jeboehm/${{ matrix.image }}
            jeboehm/${{ matrix.image }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # Deterministic ref for the Trivy scan on push: metadata-action does
            # not emit `latest` for next-branch or tag pushes.
            type=sha,format=long
      - name: Create banner
        run: .github/bin/create_banner.sh ${{ github.sha }} ${{ github.ref_name }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          # mailserver-test is never pushed, so building it for arm64 under QEMU
          # would be wasted work. It is still built on push to keep its buildx
          # cache scope warm for pull requests.
          platforms: ${{ (github.event_name == 'pull_request' || matrix.image == 'mailserver-test') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && matrix.image != 'mailserver-test' }}
          tags: ${{ github.event_name == 'pull_request' && format('jeboehm/{0}', matrix.image) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,dest={0}/{1}.tar', runner.temp, matrix.image) || '' }}
      - name: Generate artifact attestation (ghcr.io)
        if: ${{ github.event_name != 'pull_request' && matrix.image != 'mailserver-test' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/jeboehm/${{ matrix.image }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
      - name: Generate artifact attestation (docker.io)
        if: ${{ github.event_name != 'pull_request' && matrix.image != 'mailserver-test' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: index.docker.io/jeboehm/${{ matrix.image }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
      - name: Upload Docker image to artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1
  test_container_image_efficiency:
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DIVE_VER: 0.13.1 # renovate: depName=wagoodman/dive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Docker image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: images
          pattern: docker-image-*
          merge-multiple: true
      - name: Cache Dive
        id: cache-dive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/dive_${{ env.DIVE_VER }}_linux_amd64.deb
          key: ${{ runner.os }}-dive-${{ env.DIVE_VER }}
      - name: Install Dive
        run: |
          if [ ! -f "/tmp/dive_${DIVE_VER}_linux_amd64.deb" ]; then
            curl -sfL -o "/tmp/dive_${DIVE_VER}_linux_amd64.deb" \
              "https://github.com/wagoodman/dive/releases/download/v${DIVE_VER}/dive_${DIVE_VER}_linux_amd64.deb"
          fi
          sudo dpkg -i "/tmp/dive_${DIVE_VER}_linux_amd64.deb"
      - name: Check container image efficiency
        run: |
          for image in $(ls images/); do
            # mailserver-test is never published, so its layer efficiency does not matter.
            if [ "${image}" = "mailserver-test.tar" ]; then
              continue
            fi
            echo "::group::Checking image ${image}"
            dive --ci-config .github/linters/.dive-ci.yml docker-archive://images/${image}
            echo "::endgroup::"
          done
  test_docker_matrix:
    name: test_docker_matrix (${{ matrix.TEST_CASE }})
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TEST_CASE: default
            SKIP_IMAGES: postgres:18-alpine
          - TEST_CASE: relayhost
            SKIP_IMAGES: postgres:18-alpine
          - TEST_CASE: postgres
            SKIP_IMAGES: mysql:lts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Docker image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: images
          pattern: docker-image-*
          merge-multiple: true
      - name: Docker load downloaded image artifacts
        run: |
          for image in $(ls images/); do
            docker load --input images/${image}
          done
      - name: Load additional Docker images
        uses: ./.github/actions/additional-images
        with:
          mode: docker
          skip: ${{ matrix.SKIP_IMAGES }}
      - name: Prepare environment
        run: .github/bin/prepare_env.sh ${{ matrix.TEST_CASE }}
      - name: Output environment
        run: cat .env
      - name: Start components
        run: make up
      - name: Load database fixtures
        run: make fixtures
      - name: Run tests
        run: bin/test.sh run --rm test
      - name: Collect logs
        if: failure()
        run: |
          make logs
          docker ps -a
  test_kubernetes_matrix:
    name: test_kubernetes_matrix (${{ matrix.TEST_CASE }})
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: kind
      POPEYE_VER: v0.22.1 # renovate: depName=derailed/popeye
    strategy:
      matrix:
        include:
          - TEST_CASE: default
            SKIP_IMAGES: postgres:18-alpine
          - TEST_CASE: relayhost
            SKIP_IMAGES: postgres:18-alpine
          - TEST_CASE: proxy
            SKIP_IMAGES: postgres:18-alpine
          - TEST_CASE: postgres
            SKIP_IMAGES: mysql:lts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
      - name: Cache Popeye
        id: cache-popeye
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/popeye_linux_amd64.deb
          key: ${{ runner.os }}-popeye-${{ env.POPEYE_VER }}
      - name: Install Popeye
        run: |
          if [ ! -f "/tmp/popeye_linux_amd64.deb" ]; then
            curl -sfL -o "/tmp/popeye_linux_amd64.deb" \
              "https://github.com/derailed/popeye/releases/download/${{ env.POPEYE_VER }}/popeye_linux_amd64.deb"
          fi
          sudo dpkg -i /tmp/popeye_linux_amd64.deb
      - name: Use kubectl context
        run: |
          kind get clusters
          kubectl config use-context kind-${{ env.CLUSTER_NAME }}
      - name: Load additional Docker images into kind cluster
        uses: ./.github/actions/additional-images
        with:
          mode: kind
          skip: ${{ matrix.SKIP_IMAGES }}
      - name: Download docker image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: images
          pattern: docker-image-*
          merge-multiple: true
      - name: Load downloaded docker images
        run: |
          for image in $(ls images/); do
            # TLS in Kubernetes comes from `make kubernetes-tls`, no manifest
            # references the ssl image.
            if [ "${image}" = "mailserver-ssl.tar" ]; then
              continue
            fi
            echo "::group::Loading $image from downloaded artifacts into kind cluster"
            kind load image-archive images/${image}
            echo "::endgroup::"
          done
      - name: Prepare environment
        run: .github/bin/prepare_env.sh ${{ matrix.TEST_CASE }}
      - name: Prepare tls certs
        run: make kubernetes-tls
      - name: Deploy Kubernetes resources
        run: make kubernetes-deploy-helper kubernetes-up
      - name: Wait for all pods to be ready
        run: make kubernetes-wait
      - name: Run tests
        run: make kubernetes-test
      - name: Run Popeye
        run: make popeye-score
      - name: Get pod status on failure
        if: failure()
        run: |
          make kubernetes-logs
          kubectl get pods -o wide
  test_trivy_vulnerabilities:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mailserver-mda
          - image: mailserver-mta
          - image: mailserver-filter
          - image: mailserver-web
          - image: mailserver-ssl
          - image: mailserver-unbound
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Docker image artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: images
          pattern: docker-image-${{ matrix.image }}
          merge-multiple: true
      - name: Run Trivy vulnerability scanner
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: "images/${{ matrix.image }}.tar"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Log in to Container Registry (ghcr.io)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        if: ${{ github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/jeboehm/${{ matrix.image }}:sha-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "${{ matrix.image }}"

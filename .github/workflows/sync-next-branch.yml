name: Sync branch main to next
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # merge-base needs the full history of both branches, and the push has
          # to happen with a token that triggers build.yml on `next`.
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT }}
      - name: Sync branch main to next
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
        run: .github/bin/sync_next_branch.sh

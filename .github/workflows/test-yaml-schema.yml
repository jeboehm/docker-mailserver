name: Test YAML manifests
on:
  pull_request:
    paths:
      - "test/schema/**"
      - "deploy/**"
      - "target/**/Dockerfile"
      - "kustomization.yaml"
      - ".trivyignore.yaml"
      - "Makefile"
      - ".env.dist"
      - "bin/kubernetes-env.sh"
      - ".github/workflows/test-yaml-schema.yml"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  test_kustomize_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run kustomize build
        run: |
          make kubernetes-env
          kustomize build .
  test_trivy_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan manifests and Dockerfiles for misconfigurations
        run: make trivy-config
  test_yaml_schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/schema/package-lock.json
      - name: Install packages
        run: |
          cd test/schema
          npm ci
      - name: Run yaml schema test
        run: |
          cd test/schema
          ./run-tests.sh

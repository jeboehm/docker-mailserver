sql_driver = mysql

# Selected by the entrypoint when DB_TLS_VERIFY_CERT is enabled. The settings
# below are booleans, which are not expanded from the environment, so they are
# written out literally instead of being derived from a variable.
mysql default {
  host = $ENV:DB_HOST
  port = $ENV:DB_PORT
  user = $ENV:DB_USER
  password = $ENV:DB_PASSWORD
  dbname = $ENV:DB_NAME
  ssl = yes
  ssl_client_ca_dir = /etc/ssl/certs
  ssl_client_require_valid_cert = yes
}

sql_driver = pgsql

# Dovecot 2.4 only knows pgsql_host and pgsql_parameters for this driver;
# everything else goes into the parameters block as libpq keywords. There is
# no option_file equivalent, TLS is selected with sslmode.
pgsql default {
  host = $ENV:DB_HOST
  parameters {
    port = $ENV:DB_PORT
    user = $ENV:DB_USER
    password = $ENV:DB_PASSWORD
    dbname = $ENV:DB_NAME
    sslmode = prefer
  }
}

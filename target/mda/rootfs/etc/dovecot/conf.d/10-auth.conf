import_environment {
  DB_HOST = %{env:DB_HOST}
  DB_PORT = %{env:DB_PORT}
  DB_USER = %{env:DB_USER}
  DB_PASSWORD = %{env:DB_PASSWORD}
  DB_NAME = %{env:DB_NAME}
}

auth_mechanisms = plain login
auth_cache_size = 5M

# Written by the entrypoint from /etc/dovecot/auth-driver-$DB_DRIVER.conf: the
# driver settings block is named after the engine and cannot be selected
# through an environment variable. The queries below work on both engines.
!include_try /run/dovecot/auth-driver.conf

passdb sql {
  default_password_scheme = SHA256-CRYPT
  query = SELECT mail_users.name AS user, mail_domains.name AS domain, password FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id \
          WHERE mail_users.name = lower('%{user|username}') AND mail_domains.name = lower('%{user|domain}') AND enabled = true AND NOT (send_only = true AND '%{protocol}' in ('imap', 'pop3'));
}

userdb sql {
  query = SELECT concat(quota, 'M') AS quota_storage_size FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id \
          WHERE mail_users.name = lower('%{user|username}') AND mail_domains.name = lower('%{user|domain}');
  iterate_query = SELECT mail_users.name AS username, mail_domains.name AS domain FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id;
}

import_environment {
  DB_HOST = %{env:DB_HOST}
  DB_PORT = %{env:DB_PORT}
  DB_USER = %{env:DB_USER}
  DB_PASSWORD = %{env:DB_PASSWORD}
  DB_NAME = %{env:DB_NAME}
  DB_TLS_VERIFY_CERT = %{env:DB_TLS_VERIFY_CERT}
}

auth_mechanisms = plain login
auth_cache_size = 5M
# The default set without "#", plus "#" for the "cred#" logins below. Quoted,
# because an unquoted "#" starts a comment and would silently drop the rest.
auth_username_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ01234567890.-_@#"

# Written by the entrypoint from /etc/dovecot/auth-driver-$DB_DRIVER.conf: the
# driver settings block is named after the engine and cannot be selected
# through an environment variable. The queries below work on both engines.
!include_try /run/dovecot/auth-driver.conf

# Credentials mailserver-admin issues for its users, in a table it owns. Needs a
# name of its own: a second "passdb sql" would replace the block below. It comes
# first so a credential login does not wait for a bcrypt check, the quoted filter
# keeps normal logins and the hash of their password out of this query, and the
# cache stays off so deleted, expired or disabled credentials stop working at once.
passdb mailbox_credentials {
  driver = sql
  username_filter = "cred#*"
  default_password_scheme = SHA256.HEX
  use_cache = no
  sql_query = SELECT mail_users.name AS user, mail_domains.name AS domain, c.secret_hash AS password \
          FROM mail_mailbox_credentials c JOIN mail_users ON c.user_id = mail_users.id JOIN mail_domains ON mail_users.domain_id = mail_domains.id \
          WHERE CONCAT('cred#', mail_users.name) = lower('%{user|username}') AND mail_domains.name = lower('%{user|domain}') \
          AND c.secret_hash = '%{password|sha256|hexlify}' \
          AND ((c.allow_imap = true AND '%{protocol}' = 'imap') OR (c.allow_smtp = true AND '%{protocol}' = 'smtp')) \
          AND (c.expires_at IS NULL OR c.expires_at > CURRENT_TIMESTAMP) \
          AND mail_users.enabled = true AND NOT (mail_users.send_only = true AND '%{protocol}' IN ('imap', 'pop3'));
}

passdb sql {
  default_password_scheme = SHA256-CRYPT
  query = SELECT mail_users.name AS user, mail_domains.name AS domain, password FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id \
          WHERE mail_users.name = lower('%{user|username}') AND mail_domains.name = lower('%{user|domain}') AND enabled = true AND NOT (send_only = true AND '%{protocol}' in ('imap', 'pop3'));
}

userdb sql {
  query = SELECT concat(quota, 'M') AS quota_storage_size FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id \
          WHERE mail_users.name = lower('%{user|username}') AND mail_domains.name = lower('%{user|domain}');
  iterate_query = SELECT mail_users.name AS username, mail_domains.name AS domain FROM mail_users JOIN mail_domains ON mail_users.domain_id = mail_domains.id;
}
